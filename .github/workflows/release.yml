name: Build & Release

# Two ways to use this workflow (docs/BUILD-AND-RELEASE.md section 3):
#
# 1. Release: push a tag like v0.1.0 (`pnpm bump`, then `git tag` and `git push`). It builds the Windows,
#    macOS and Linux installers into a draft release, and, only if every build succeeded, gives the
#    installers permanent download names and publishes the release. The README links to those names.
#
# 2. Just build: Actions tab > "Build & Release" > "Run workflow". Builds the chosen platforms and keeps
#    the installers as downloadable workflow artifacts. No release is created.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Manual build ({0})', inputs.platform) || format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which installers to build
        type: choice
        options: [all, windows, macos, linux]
        default: all
      keep_artifacts:
        description: Keep the installers as downloadable artifacts of this run
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Fails the whole run before any expensive build starts if the tag and the versions disagree.
      - name: Check versions
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-versions.mjs "$TAG"

      - name: Choose platforms
        id: matrix
        env:
          PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
        run: |
          all='[
            {"name":"windows","os":"windows-latest","args":""},
            {"name":"macos","os":"macos-latest","args":"--target universal-apple-darwin"},
            {"name":"linux","os":"ubuntu-22.04","args":""}
          ]'
          matrix=$(jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .name == $p))' <<< "$all")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Building: $matrix"

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Creating a release needs write access. Manual runs never use it.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          linux-deps: "true"

      # One universal binary for Apple Silicon and Intel.
      - name: Add macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is added later (docs/BUILD-AND-RELEASE.md section 4). Until then installers are
          # unsigned. When the secrets exist, set them here:
          #   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (updater, Phase 2)
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                         (macOS notarisation)
        with:
          # An empty tagName builds without creating a release (manual runs).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: lunaRun ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. These installers are not code-signed yet.
          # Always a draft first: it only goes public in the `publish` job, after all builds passed.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' && inputs.keep_artifacts }}
          args: ${{ matrix.args }}

      # Proof that real installers exist, independent of artifact storage.
      - name: List installers
        shell: bash
        run: |
          installers=$(find target -path '*/release/bundle/*' -type f | grep -E '\.(exe|msi|dmg|deb|rpm|AppImage)$' || true)
          if [ -z "$installers" ]; then
            echo "::error::No installers were produced"
            exit 1
          fi
          echo "$installers" | while read -r file; do ls -l "$file"; done

  # Runs only for tags, and only when every platform built. Until this job succeeds the release stays a
  # hidden draft, so a half-finished build can never reach the download page.
  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Give the installers permanent names and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: node scripts/finalize-release.mjs "$TAG" --publish
