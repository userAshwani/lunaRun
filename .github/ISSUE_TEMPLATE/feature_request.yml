name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. The product scope and priorities live in
        [docs/PRD.md](https://github.com/userAshwani/lunaRun/blob/main/docs/PRD.md) and
        [docs/ROADMAP.md](https://github.com/userAshwani/lunaRun/blob/main/docs/ROADMAP.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. Who runs into it, and how often?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like lunaRun to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, other tools, or alternative designs you considered.
    validations:
      required: false
  - type: dropdown
    id: persona
    attributes:
      label: Who is this mainly for?
      options:
        - Freelancer or agency developer with many projects
        - Student or beginner
        - Team lead who wants everyone on the same versions
        - Maintainer of legacy applications
        - Someone else
    validations:
      required: false
