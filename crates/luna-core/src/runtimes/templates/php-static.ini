; Generated by lunaRun when this PHP version was installed. Installing it again overwrites this file.
; Put your own settings in conf.d/99-user.ini next to it: lunaRun never overwrites that one.
;
; Static builds of PHP have their extensions compiled in, so there is no extension list here.

[PHP]
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
html_errors = Off

memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 120

[Date]
date.timezone = {{timezone}}

[curl]
curl.cainfo = {{cafile}}

[openssl]
openssl.cafile = {{cafile}}
