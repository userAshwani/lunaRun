; Generated by lunaRun. Changes made here are overwritten when lunaRun starts this PHP.
; Your own PHP settings go into conf.d/99-user.ini next to php.ini (it is never overwritten).

[global]
daemonize = no
error_log = {{error_log}}

[www]
listen = 127.0.0.1:{{port}}
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
catch_workers_output = yes
clear_env = no
