[package]
name = "luna-core"
description = "UI-free core library of lunaRun: runtimes, services, projects and detection."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[dev-dependencies]
tempfile = "3.27.0"
