[package]
name = "luna-core"
description = "UI-free core library of lunaRun: runtimes, services, projects and detection."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
directories = "6.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "xz"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "fs", "io-util", "macros"] }
tokio-util = { version = "0.7.20", default-features = false }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "xz", "encoder"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
